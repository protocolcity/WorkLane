name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Public source boundary
        run: python scripts/check_public_surface.py
      - name: Install
        run: pip install -e . && pip install pytest httpx

      - name: Run complete test suite
        env:
          WORKLANE_RUNTIME_DIR: ${{ runner.temp }}/worklane-tests
          WORKFORCE_NO_DESK: "1"
        run: python -m pytest tests -q
